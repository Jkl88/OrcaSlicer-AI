# Windows x64 NSIS installer for the OrcaSlicer-AI fork.
name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'deps/**'
      - '**/CMakeLists.txt'
      - 'version.inc'
      - 'resources/**'
      - 'localization/**'
      - '.github/workflows/build_windows_installer.yml'
      - '.github/workflows/build_orca.yml'
      - '.github/workflows/build_deps.yml'
      - '.github/workflows/build_check_cache.yml'
      - 'build_release_vs.bat'
      - 'build_release_vs2022.bat'
      - 'plugins/**'

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  build_windows_x64:
    name: Build Windows x64
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: windows-latest
      arch: x64
    secrets: inherit

  unit_tests_windows_x64:
    name: Windows x64 tests
    needs: build_windows_x64
    if: ${{ !cancelled() && success() }}
    uses: ./.github/workflows/unit_tests.yml
    with:
      os: windows-latest
      artifact: ${{ github.sha }}-tests-windows-x64

  plugins:
    name: Plugin tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install plugin dependencies
        run: python -m pip install "qrcode>=7.4,<9" "Pillow>=10,<13" "zxing-cpp>=2.3,<4"

      - name: Run plugin tests
        run: |
          python -m unittest discover -s plugins/filament_qr/tests -t plugins/filament_qr -v
          python -m unittest discover -s plugins/ai_assist/tests -t plugins/ai_assist -v

      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: OrcaSlicer_plugins
          path: |
            plugins/filament_qr/orca_filament_qr.py
            plugins/ai_assist/orca_ai_assist.py

  release:
    name: Publish GitHub Release
    needs: [build_windows_x64, unit_tests_windows_x64, plugins]
    if: ${{ success() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: |
          ver=$(grep 'set(SoftFever_VERSION' version.inc | cut -d '"' -f2)
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=v${ver}" >> "$GITHUB_OUTPUT"

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: OrcaSlicer_Windows_*
          path: artifacts
          merge-multiple: true

      - name: Download plugins
        uses: actions/download-artifact@v4
        with:
          name: OrcaSlicer_plugins
          path: plugins_out

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          set -euo pipefail
          mkdir -p upload
          find artifacts -type f -name '*.exe' ! -iname '*portable*' ! -iname '*profile_validator*' -exec cp -v {} upload/ \;
          find artifacts -type f -name '*portable*.zip' -exec cp -v {} upload/ \;
          find plugins_out -type f -name '*.py' -exec cp -v {} upload/ \;
          ls -lah upload || true
          if [ -z "$(ls -A upload 2>/dev/null)" ]; then
            echo "::error::No Windows installer artifacts found"
            exit 1
          fi

          NOTES=$(cat <<ENDNOTES
          ## OrcaSlicer-AI ${VER}

          OrcaSlicer with the versioned plugin host API (\`orca.host.v1\`): private plugin storage,
          preset snapshots and user-confirmed preset transactions.

          ### Windows x64
          1. Install \`OrcaSlicer_Windows_*.exe\`.
          2. Download the plugins you need: \`orca_ai_assist.py\` (Gemini preset assistant) and/or
             \`orca_filament_qr.py\` (spool QR labels and phone scanning).
          3. In OrcaSlicer open **Plugins → Install from file** and pick the downloaded \`.py\`.

          Guide: https://github.com/${{ github.repository }}/blob/main/docs/PLUGINS_RU.md
          ENDNOTES
          )
          )

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" upload/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes "$NOTES" --latest
          else
            gh release create "$TAG" upload/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "OrcaSlicer-AI ${VER}" \
              --notes "$NOTES" \
              --latest
          fi
